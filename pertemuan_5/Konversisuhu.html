<!DOCTYPE html>
<html>
<head>
    <title>Konversi Suhu</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; background: #f0f8ff; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; width: 80%; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .hasil { font-size: 20px; font-weight: bold; margin-top: 20px; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌡️ Konversi Suhu</h2>
        <input type="number" id="celcius" placeholder="Masukkan Suhu (Celcius)"><br>
        <button onclick="konversiSuhu()">Konversi ke Fahrenheit</button>
        <div class="hasil">Hasil: <span id="hasilFahrenheit">-</span></div>
    </div>

    <script>
        function konversiSuhu() {
            let c = parseFloat(document.getElementById('celcius').value);
            if (isNaN(c)) {
                alert("Masukkan angka yang valid!");
                return;
            }
            let f = (c * 9 / 5) + 32;
            document.getElementById('hasilFahrenheit').innerText = f + " °F";
        }
    </script>
</body>
</html>
